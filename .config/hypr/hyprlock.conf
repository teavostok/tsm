background {
  monitor =
  path = /home/teavostok1/wallpaper.jpg
  blur_passes = 3
  blur_size = 8
  noise = 0.01
  contrast = 1.1
  brightness = 0.9
  vibrancy = 0.2
}

input-field {
  monitor =
  size = 300, 50
  outline_thickness = 0
  dots_size = 0.3
  dots_spacing = 0.5
  dots_center = true
  dots_rounding = 4
  outer_color = rgba(0, 0, 0, 0)
  inner_color = rgba(44, 44, 46, 0.8)
  font_color = rgba(255, 255, 255, 0.92)
  fade_on_empty = false
  placeholder_text = <i>Enter password...</i>
  hide_input = false
  position = 0, -120
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +'%I:%M %p')"
  color = rgba(255, 255, 255, 0.92)
  font_size = 72
  font_family = SF Pro Display
  position = 0, 40
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +'%A, %B %d')"
  color = rgba(255, 255, 255, 0.55)
  font_size = 18
  font_family = SF Pro Text
  position = 0, -20
  halign = center
  valign = center
}
