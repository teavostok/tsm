
#autogenerated = 1

$mainMod = SUPER

#AUTO-LAUNCH
exec-once = ~/.config/waybar/scripts/launch.sh
exec-once = hypridle
exec-once = awww-daemon
exec-once = awww img /home/teavostok1/wallpaper.jpg
exec-once = waybar
exec-once = swaync
exec-once = python3 /home/teavostok1/.config/swaync/mpris-glow.py --watch
exec-once = mpd


#MONITORS
monitor=eDP-1, 1920x1200@60, 0x0, 1


#ENVIRONMENT-VARIABLES
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
#TOOLKIT BACKEND
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
#qt-variables
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct


#DEFAULT APPLICATIONS
$terminal = kitty
$fileManager = Dolphin
$menu = rofi -theme ~/.config/rofi/rofi.rasi -show drun

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, P, exec, wlogout
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, Space, exec, $menu
bind = $mainMod SHIFT, S, exec, grimblast --freeze copysave area ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png
bind = $mainMod, N, exec, swaync-client --toggle-panel
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod, W, exec, ~/.config/waybar/scripts/wallpaper.sh --next

# Switch to workspace with Super + [1-4]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Move active window to workspace with Super + Shift + [1-4]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

#Move through workspaces with Super + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# LOOK AND FEEL
# DECORATIONS
#############
# decoration.conf — macOS-inspired visuals for Hyprland (0.53+)


general{
	gaps_in = 7
	gaps_out = 8
	border_size = 1
	resize_on_border = true
	allow_tearing = false
	layout = dwindle
    col.active_border = rgba(ffffffaa) rgba(ffffff22) 45deg
    col.inactive_border = rgba(ffffff33) rgba(ffffff11) 45deg
}
decoration {
    rounding           = 15
    rounding_power     = 4

    active_opacity     = 1.0
    inactive_opacity   = 0.8
    fullscreen_opacity = 1.0

    dim_inactive       = true
    dim_strength       = 0.06
    dim_special        = 0.25
    dim_around         = 0.45

    blur {
    enabled = true

    size = 4
    passes = 2

    brightness = 1.08
    contrast = 1.12

    noise = 0.01

    vibrancy = 0.55
    vibrancy_darkness = 0.15

    new_optimizations = true
    ignore_opacity = false
}

    shadow {
    enabled = true
    range = 18
    render_power = 2
    color = rgba(00000018)
    color_inactive = rgba(00000010)
}
}

# layer blur — frosted glass for bars and launchers
layerrule = blur on, ignore_alpha 0.2, match:namespace waybar
layerrule = blur on, ignore_alpha 0.2, match:namespace rofi
layerrule = blur on, ignore_alpha 0.2, match:namespace wofi
layerrule = blur on, ignore_alpha 0.2, match:namespace dunst
layerrule = blur on, ignore_alpha 0.2, match:namespace mako
layerrule = blur on, ignore_alpha 0.2, match:namespace swaync

# terminals
windowrule = opacity 0.92 0.82, match:class ^(Alacritty)$
windowrule = opacity 0.92 0.82, match:class ^(foot)$
windowrule = opacity 0.92 0.82, match:class ^(wezterm)$

# file managers
windowrule = opacity 0.95 0.90, match:class ^(Dolphin)$
windowrule = opacity 0.95 0.90, match:class ^(Dolphin)$

# editors
windowrule = opacity 1.0 0.95, match:class ^(code)$
windowrule = opacity 1.0 0.95, match:class ^(zed)$

# media
windowrule = opacity 1.0 1.0, match:class ^(mpv)$
windowrule = opacity 1.0 1.0, match:class ^(vlc)$

# picture-in-picture
windowrule = float on, pin on, no_shadow on, rounding 10, match:title ^(Picture-in-Picture)$

# launchers
windowrule = rounding 16, no_shadow on, match:class ^(rofi)$
windowrule = rounding 16, no_shadow on, match:class ^(wofi)$

# notifications
windowrule = rounding 12, no_shadow on, match:class ^(dunst)$

# spotify
windowrule = opacity 0.96 0.88, match:class ^(Spotify)$

# steam
windowrule = opacity 1.0 1.0, match:class ^(steam)$

# ANIMATIONS

# animations.conf — macOS-inspired motion for Hyprland (0.45+)

animations {
    enabled = true

    bezier = expOut,      0.16, 1.00, 0.30, 1.00
    # Quint-out - softer ease for fades & colour blends
    bezier = quintOut,    0.22, 1.00, 0.36, 1.00
    # Micro-spring - 2–4 % controlled overshoot 
    bezier = microSpring, 0.35, 1.04, 0.50, 1.02
    # Expo-in   - clean acceleration snap for dismissals
    bezier = expIn,       0.55, 0.00, 0.90, 0.90
    # Spatial   - fluid ease tuned for workspace panning
    bezier = spatial,     0.22, 1.00, 0.40, 1.00

    # Opens  - spring scale 82% -> 100%, alive without bouncing
    animation = windowsIn,   1, 5, microSpring, popin 82%
    # Closes - expo-in snap, exits without lingering
    animation = windowsOut,  1, 3, expIn,       popin 82%
    # Move / resize - smooth glide that keeps pace with the pointer
    animation = windowsMove, 1, 4, expOut

    animation = fadeIn,     1, 4, quintOut   # gentle entrance
    animation = fadeOut,    1, 2, expIn      # quick, clean exit
    animation = fadeSwitch, 1, 3, quintOut   # smooth focus transfer
    animation = fadeShadow, 1, 5, quintOut   # shadow tracks window softly
    animation = fadeDim,    1, 4, quintOut   # inactive dim is subtle
    animation = fadeLayers, 1, 4, quintOut   # layer cross-fades

    # Extra time lets colour transitions read as intentional, not flickery
    animation = border,     1, 10, quintOut

    animation = workspaces,       1, 5, spatial,  slide
    animation = specialWorkspace, 1, 5, quintOut, slidevert
}

windowrule {
	
	name = fix-xwayland-drags
	match:class = ^$
	match:title = ^$
	match:xwayland = true
	match:float = true
	match:fullscreen = false
	match:pin = false

	no_focus = true
}

dwindle{
	preserve_split = true
}
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow



##INPUT##

input{
	kb_layout = us
	sensitivity = 0

	touchpad{
		natural_scroll = true
	} 
}

gesture = 3, horizontal, workspace
